# backito.toml -- commit this file. It says WHICH database and bucket a project
# backs up, and holds no secrets.
#
# Credentials come from the environment, so the same file works under dotenvx,
# a CI secret store, or a plain export:
#
#   BACKITO_ACCESS_KEY_ID
#   BACKITO_SECRET_ACCESS_KEY

[database]
# Short name used to build archive keys: app-backup-20260803-0942.dump
label = "app"

# Docker container running Postgres. pg_dump runs inside it, so the client
# binary always matches the server version and the host needs no Postgres.
container = "app-db"

# Instead of `container`, name the service and let backito look the container up
# each time it needs one. Set exactly one of the two.
#
# Worth doing wherever nothing guarantees the container name: compose derives
# <project>-<service>-<n>, and orchestrators such as uncloud append a fresh
# random suffix on every redeploy, so a name written here goes stale the next
# time something is deployed.
#
#   service = "db"
#
# Which container label carries the service name. Defaults to compose's, so
# a plain `docker compose` project needs nothing here; uncloud writes
# uncloud.service.name and has to say so.
#
#   container_label = "com.docker.compose.service"

# Database to dump.
name = "postgres"

# Role to connect as. Inside the container this authenticates over the unix
# socket, so no password is involved. Defaults to "postgres".
user = "postgres"

# Image used for the throwaway database `backito verify` restores into.
# Must be the same major version the container above serves, or the restore
# will not start.
image = "postgres:17"

# Parallel jobs pg_restore uses. Higher is faster, but each worker builds
# indexes in its own memory, so a memory-capped container can OOM mid-restore.
# Drop to 1 for a tight target. Defaults to 4.
restore_jobs = 4

[storage]
# S3-compatible endpoint. For Cloudflare R2:
#   https://<account-id>.r2.cloudflarestorage.com
endpoint = "https://<account-id>.r2.cloudflarestorage.com"

# Bucket that holds archives. Give it its own credential: a token scoped to
# this one bucket cannot damage anything else if it leaks.
bucket = "app-database-backups"

# Region label. Services that ignore regions (R2 among them) want "auto".
region = "auto"

# Physical backups, for point-in-time recovery. Leave this section out and none
# of it runs: the logical backups above are independent of it.
#
# [walg]
# Where WAL segments and base backups go. Give each cluster its own prefix:
# segments are named after the LSN, which two clusters both produce, so a shared
# prefix means each overwrites the other's archive.
# s3_prefix = "s3://app-walg/"
#
# How often to take a base backup, and how many to keep. Each is a full copy of
# the cluster, so retain_full is a disk bill rather than a retention policy.
# base_interval = "24h"
# retain_full = 3
#
# Optional. The endpoint defaults to [storage].endpoint above, since it is
# account-level and only the bucket and its token differ.
# endpoint = "https://<account-id>.r2.cloudflarestorage.com"
# data_dir = "/var/lib/postgresql/data"
# binary = "wal-g"
#
# WAL storage has its own credentials, from the environment:
#   BACKITO_WALG_ACCESS_KEY_ID
#   BACKITO_WALG_SECRET_ACCESS_KEY
