[package]
name = "backito"
version = "0.1.0"
edition = "2024"
description = "Back up a containerised Postgres database to S3-compatible storage, and prove the archive restores"
license = "MIT"
repository = "https://github.com/andyngdz/backito"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
humansize = "2.1.3"
indicatif = { version = "0.18", features = ["tokio"] }
jiff = "0.2.35"
rust-s3 = { version = "0.37.2", default-features = false, features = [
  "tokio-rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
thousands = "0.2.0"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "time",
] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
indoc = "2"
tempfile = "3"
