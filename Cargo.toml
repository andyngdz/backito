[package]
name = "backito"
version = "0.1.0"
edition = "2024"
description = "Back up a containerised Postgres database to S3-compatible storage, and prove the archive restores"
license = "MIT"
repository = "https://github.com/andyngdz/backito"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
indicatif = { version = "0.18", features = ["tokio"] }
jiff = "0.2.35"
# rust-s3 sizes its multipart concurrency from the host's free memory and cannot
# see a container limit, so a 900 MiB archive peaked at 1610 MiB and was
# OOM-killed under any sane cgroup cap (durch/rust-s3#346). object_store lets the
# caller bound both chunk size and in-flight parts.
object_store = { version = "0.14.1", default-features = false, features = [
  "aws",
] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
thousands = "0.2.0"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "signal",
  "time",
] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
indoc = "2"
